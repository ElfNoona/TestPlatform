version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Local dev: Postgres + Redis + backend + compiler (api + worker) +
#            grading-service + proctoring
#
# NOT containerised for dev: frontend (npm run dev), admin (run manually)
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=1000"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-examplatform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examuser}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Application services ────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://examuser:changeme@postgres:5432/examplatform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      TEACHER_AUTH_PROVIDER: ${TEACHER_AUTH_PROVIDER:-todo}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET:-}
      TEACHER_ALLOWLIST_EMAILS: ${TEACHER_ALLOWLIST_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  judge0-server:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-examuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-examplatform}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    privileged: true

  judge0-worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-examuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_DB=${POSTGRES_DB:-examplatform}
      - MAX_CONCURRENT_JOBS=14
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    privileged: true

  grading-service:
    build:
      context: ./grading-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${GRADING_PORT:-6000}:6000"
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://examuser:changeme@postgres:5432/examplatform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_GRADING_PROVIDER: ${AI_GRADING_PROVIDER:-todo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JUDGE0_API_URL: ${JUDGE0_API_URL:-http://judge0-server:2358}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./grading-service:/app
      - /app/node_modules

  proctoring:
    build:
      context: ./proctoring
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PROCTORING_PORT:-7000}:7000"
    environment:
      NODE_ENV: development
      PROCTORING_PORT: ${PROCTORING_PORT:-7000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://examuser:changeme@postgres:5432/examplatform}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-dev-service-key}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      # AWS S3 (set MEDIA_STORAGE_PROVIDER=s3)
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      # Cloudflare R2 (set MEDIA_STORAGE_PROVIDER=r2)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./proctoring:/app
      - /app/node_modules
      - uploads:/app/uploads   # local fallback until OCI is wired up

volumes:
  postgres_data:
  uploads:
